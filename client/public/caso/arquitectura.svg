<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura de la pizarra</title>
  <desc id="descripcion">El navegador guarda una copia del documento Yjs en IndexedDB y habla con el servidor por HTTP (cuentas y permisos) y por WebSocket (updates y presencia). El servidor resuelve permisos, valida cada update en una copia de prueba, lo reenvía a las demás personas de la sala y guarda el estado completo en PostgreSQL. El paquete compartido define el documento, el protocolo y los límites para los dos lados.</desc>

  <defs>
    <filter id="caja" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#142034" flood-opacity="0.16" />
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#52607a" />
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1f47c7" />
    </marker>
  </defs>

  <rect width="800" height="380" fill="#eef1f6" />

  <!-- Navegador -->
  <g filter="url(#caja)">
    <rect x="24" y="40" width="270" height="180" rx="14" fill="#fff" stroke="#141d2b" stroke-opacity="0.1" />
  </g>
  <text x="44" y="68" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em">NAVEGADOR</text>
  <text x="44" y="96" fill="#141d2b" font-family="'Instrument Sans', system-ui, sans-serif" font-size="15" font-weight="600">useBoard</text>
  <text x="44" y="120" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">Y.Doc + socket + presencia</text>
  <g>
    <rect x="44" y="136" width="230" height="30" rx="8" fill="#1f47c7" fill-opacity="0.08" />
    <text x="56" y="156" fill="#1b2d63" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">copia local en IndexedDB</text>
  </g>
  <text x="44" y="190" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">se edita con o sin conexión;</text>
  <text x="44" y="208" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">al volver, manda lo que falte</text>

  <!-- Servidor -->
  <g filter="url(#caja)">
    <rect x="450" y="40" width="326" height="180" rx="14" fill="#fff" stroke="#141d2b" stroke-opacity="0.1" />
  </g>
  <text x="470" y="68" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em">SERVIDOR (NODE + WS)</text>
  <text x="470" y="96" fill="#141d2b" font-family="'Instrument Sans', system-ui, sans-serif" font-size="15" font-weight="600">Accounts</text>
  <text x="470" y="116" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">sesiones, tickets y permisos</text>
  <text x="470" y="146" fill="#141d2b" font-family="'Instrument Sans', system-ui, sans-serif" font-size="15" font-weight="600">Room</text>
  <text x="470" y="166" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">valida en una copia de prueba,</text>
  <text x="470" y="184" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">aplica y reenvía a los demás</text>
  <text x="470" y="206" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">guardado en lote (≤ 1 s)</text>

  <!-- Flechas entre navegador y servidor -->
  <line x1="300" y1="100" x2="444" y2="100" stroke="#52607a" stroke-width="1.6" marker-start="url(#flecha)" marker-end="url(#flecha)" />
  <text x="372" y="92" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" text-anchor="middle">HTTP: cuentas</text>

  <line x1="300" y1="160" x2="444" y2="160" stroke="#1f47c7" stroke-width="1.8" marker-start="url(#flecha-azul)" marker-end="url(#flecha-azul)" />
  <text x="372" y="152" fill="#1f47c7" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">WebSocket</text>
  <text x="372" y="180" fill="#1f47c7" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" text-anchor="middle">updates + presencia</text>

  <!-- PostgreSQL -->
  <g transform="translate(556 254)">
    <ellipse cx="57" cy="12" rx="57" ry="12" fill="#fff" stroke="#141d2b" stroke-opacity="0.12" />
    <path d="M0 12v42a57 12 0 0 0 114 0V12" fill="#fff" stroke="#141d2b" stroke-opacity="0.12" />
    <text x="57" y="46" fill="#141d2b" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">PostgreSQL</text>
  </g>
  <line x1="613" y1="222" x2="613" y2="250" stroke="#52607a" stroke-width="1.6" marker-end="url(#flecha)" />

  <!-- Paquete compartido -->
  <g filter="url(#caja)">
    <rect x="24" y="286" width="440" height="58" rx="12" fill="#fff" stroke="#141d2b" stroke-opacity="0.1" />
  </g>
  <text x="44" y="312" fill="#141d2b" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="600">@pizarra/shared</text>
  <text x="44" y="332" fill="#52607a" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13">documento, protocolo, límites y permisos: los dos lados compilan con lo mismo</text>
  <line x1="159" y1="284" x2="159" y2="226" stroke="#52607a" stroke-width="1.4" stroke-dasharray="4 4" />
  <line x1="330" y1="284" x2="330" y2="226" stroke="#52607a" stroke-width="1.4" stroke-dasharray="4 4" />
  <line x1="330" y1="226" x2="520" y2="226" stroke="#52607a" stroke-width="1.4" stroke-dasharray="4 4" />
  <line x1="520" y1="226" x2="520" y2="224" stroke="#52607a" stroke-width="1.4" stroke-dasharray="4 4" />
</svg>
