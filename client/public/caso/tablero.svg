<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Un tablero de la pizarra con tres notas y dos cursores</title>
  <desc id="descripcion">Tres notas adhesivas de colores, ligeramente inclinadas, sobre un fondo de puntos. Dos cursores con el nombre de cada persona; una de ellas está escribiendo en una nota, que aparece resaltada. Arriba, la barra flotante con el estado «En vivo», los avatares y el botón «Nueva nota».</desc>

  <defs>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse" x="12" y="12">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#475976" fill-opacity="0.28" />
    </pattern>

    <filter id="sombra-nota" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#142034" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#142034" flood-opacity="0.22" />
    </filter>

    <filter id="sombra-barra" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#142034" flood-opacity="0.22" />
    </filter>

    <filter id="sombra-cursor" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#142034" flood-opacity="0.35" />
    </filter>

    <linearGradient id="papel-amarillo" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%" stop-color="#fff0b8" />
      <stop offset="24%" stop-color="#ffe27a" />
      <stop offset="100%" stop-color="#f0cd60" />
    </linearGradient>
    <linearGradient id="papel-verde" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%" stop-color="#e2f5d6" />
      <stop offset="24%" stop-color="#c6ebb1" />
      <stop offset="100%" stop-color="#b0d99a" />
    </linearGradient>
    <linearGradient id="papel-rosa" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%" stop-color="#ffdde7" />
      <stop offset="24%" stop-color="#ffc3d4" />
      <stop offset="100%" stop-color="#f0adc0" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#e4e9f0" />
  <rect width="800" height="450" fill="url(#puntos)" />

  <!-- Nota amarilla -->
  <g transform="translate(96 150) rotate(-3)" filter="url(#sombra-nota)">
    <rect width="180" height="180" rx="3" fill="url(#papel-amarillo)" />
    <path d="M0 3a3 3 0 0 1 3-3h174a3 3 0 0 1 3 3v25H0z" fill="#3c2800" fill-opacity="0.05" />
    <g fill="#2b2414" fill-opacity="0.42">
      <circle cx="16" cy="10" r="1.6" /><circle cx="24" cy="10" r="1.6" />
      <circle cx="16" cy="16" r="1.6" /><circle cx="24" cy="16" r="1.6" />
      <circle cx="16" cy="22" r="1.6" /><circle cx="24" cy="22" r="1.6" />
    </g>
    <text x="16" y="60" fill="#2b2414" font-family="'Patrick Hand', 'Segoe Print', cursive" font-size="20">Cerrar la etapa</text>
    <text x="16" y="86" fill="#2b2414" font-family="'Patrick Hand', 'Segoe Print', cursive" font-size="20">antes del viernes</text>
  </g>

  <!-- Nota verde, la que alguien está escribiendo -->
  <g transform="translate(320 92) rotate(2)">
    <g filter="url(#sombra-nota)">
      <rect width="180" height="180" rx="3" fill="url(#papel-verde)" />
      <path d="M0 3a3 3 0 0 1 3-3h174a3 3 0 0 1 3 3v25H0z" fill="#3c2800" fill-opacity="0.05" />
      <g fill="#2b2414" fill-opacity="0.42">
        <circle cx="16" cy="10" r="1.6" /><circle cx="24" cy="10" r="1.6" />
        <circle cx="16" cy="16" r="1.6" /><circle cx="24" cy="16" r="1.6" />
        <circle cx="16" cy="22" r="1.6" /><circle cx="24" cy="22" r="1.6" />
      </g>
      <text x="16" y="60" fill="#2b2414" font-family="'Patrick Hand', 'Segoe Print', cursive" font-size="20">Probar sin wifi</text>
      <text x="16" y="86" fill="#2b2414" font-family="'Patrick Hand', 'Segoe Print', cursive" font-size="20">en dos pestañas</text>
      <rect x="134" y="70" width="1.6" height="20" fill="#2b2414" />
    </g>
    <!-- Contorno de «alguien está escribiendo aquí» -->
    <rect x="-3" y="-3" width="186" height="186" rx="5" fill="none" stroke="#0f766e" stroke-width="2" />
    <g transform="translate(-3 -24)">
      <rect width="96" height="20" rx="6" fill="#0f766e" />
      <path d="M7 15h3l8-8a2 2 0 0 0-3-3l-8 8z" fill="#fff" fill-opacity="0.9" />
      <text x="24" y="14" fill="#fff" font-family="'Instrument Sans', system-ui, sans-serif" font-size="11" font-weight="600">Nutria curiosa</text>
    </g>
  </g>

  <!-- Nota rosa -->
  <g transform="translate(540 218) rotate(-2)" filter="url(#sombra-nota)">
    <rect width="180" height="180" rx="3" fill="url(#papel-rosa)" />
    <path d="M0 3a3 3 0 0 1 3-3h174a3 3 0 0 1 3 3v25H0z" fill="#3c2800" fill-opacity="0.05" />
    <g fill="#2b2414" fill-opacity="0.42">
      <circle cx="16" cy="10" r="1.6" /><circle cx="24" cy="10" r="1.6" />
      <circle cx="16" cy="16" r="1.6" /><circle cx="24" cy="16" r="1.6" />
      <circle cx="16" cy="22" r="1.6" /><circle cx="24" cy="22" r="1.6" />
    </g>
    <text x="16" y="60" fill="#2b2414" font-family="'Patrick Hand', 'Segoe Print', cursive" font-size="20">¿Y si se corta</text>
    <text x="16" y="86" fill="#2b2414" font-family="'Patrick Hand', 'Segoe Print', cursive" font-size="20">a la mitad?</text>
  </g>

  <!-- Barra flotante -->
  <g transform="translate(250 16)" filter="url(#sombra-barra)">
    <rect width="300" height="46" rx="14" fill="#ffffff" fill-opacity="0.92" stroke="#141d2b" stroke-opacity="0.1" />
    <g transform="translate(12 14)">
      <rect width="17" height="17" rx="2" fill="#ffe27a" transform="rotate(-7 8.5 8.5)" />
      <rect width="17" height="5" rx="2" fill="#1f47c7" transform="rotate(-7 8.5 8.5)" />
    </g>
    <text x="38" y="28" fill="#141d2b" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="600">Pizarra</text>
    <g transform="translate(96 12)">
      <rect width="74" height="22" rx="11" fill="#188a52" fill-opacity="0.12" />
      <circle cx="13" cy="11" r="4" fill="#188a52" />
      <text x="23" y="15" fill="#146b40" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" font-weight="600">En vivo</text>
    </g>
    <g transform="translate(180 11)">
      <circle cx="12" cy="12" r="12" fill="#4f46e5" />
      <text x="12" y="16" fill="#fff" font-family="'Instrument Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AP</text>
      <circle cx="30" cy="12" r="12" fill="#0f766e" stroke="#fff" stroke-width="2" />
      <text x="30" y="16" fill="#fff" font-family="'Instrument Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">NC</text>
    </g>
    <g transform="translate(228 10)">
      <rect width="60" height="26" rx="9" fill="#1f47c7" />
      <path d="M14 13h12M20 7v12" stroke="#fff" stroke-width="2" stroke-linecap="round" />
      <text x="32" y="17" fill="#fff" font-family="'Instrument Sans', system-ui, sans-serif" font-size="11" font-weight="600">Nota</text>
    </g>
  </g>

  <!-- Cursores -->
  <g transform="translate(470 250)" filter="url(#sombra-cursor)">
    <path d="M1.5 1.5v15l4.2-3.9 3 6.4 2.9-1.3-3-6.3 5.8-.2z" fill="#0f766e" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" />
    <g transform="translate(12 17)">
      <path d="M0 4a4 4 0 0 1 4-4h84a10 10 0 0 1 10 10 10 10 0 0 1-10 10H10A10 10 0 0 1 0 10z" fill="#0f766e" />
      <text x="9" y="14" fill="#fff" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" font-weight="600">Nutria curiosa</text>
    </g>
  </g>

  <g transform="translate(232 322)" filter="url(#sombra-cursor)">
    <path d="M1.5 1.5v15l4.2-3.9 3 6.4 2.9-1.3-3-6.3 5.8-.2z" fill="#4f46e5" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" />
    <g transform="translate(12 17)">
      <path d="M0 4a4 4 0 0 1 4-4h62a10 10 0 0 1 10 10 10 10 0 0 1-10 10H10A10 10 0 0 1 0 10z" fill="#4f46e5" />
      <text x="9" y="14" fill="#fff" font-family="'Instrument Sans', system-ui, sans-serif" font-size="12" font-weight="600">Ana Prueba</text>
    </g>
  </g>
</svg>
